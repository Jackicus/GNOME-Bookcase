<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPDX-License-Identifier: GPL-2.0-or-later -->
  <!-- SPDX-FileCopyrightText: 2026 Jack Tully -->
  <!-- A small wooden bookcase seen from the front, two shelves of books in GNOME's palette:
       some standing, one leaning, a pair lying flat. A physical object lit from above,
       standing on a darker base, as the HIG asks of an app icon. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdab8f"/>
      <stop offset="1" stop-color="#b5835a"/>
    </linearGradient>
    <linearGradient id="wood-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#986a44"/>
      <stop offset="1" stop-color="#865e3c"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2b1c"/>
      <stop offset="0.25" stop-color="#63452c"/>
      <stop offset="1" stop-color="#6f4d31"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- The case: its base, its face, the two compartments. -->
  <rect x="12" y="16" width="104" height="104" rx="8" fill="url(#wood-side)"/>
  <rect x="12" y="10" width="104" height="104" rx="8" fill="url(#wood)"/>
  <rect x="12.5" y="10.5" width="103" height="103" rx="7.5" fill="none" stroke="#ffffff"
        stroke-opacity="0.25"/>
  <rect x="20" y="18" width="88" height="40" rx="3" fill="url(#inside)"/>
  <rect x="20" y="66" width="88" height="40" rx="3" fill="url(#inside)"/>

  <!-- The top shelf: five books standing, the last leaning on them. -->
  <g>
    <rect x="25" y="27" width="11" height="31" rx="1.5" fill="#3584e4"/>
    <rect x="25" y="27" width="11" height="31" rx="1.5" fill="url(#shine)"/>
    <rect x="25" y="32" width="11" height="3" fill="#1a5fb4"/>
    <rect x="25" y="50" width="11" height="3" fill="#1a5fb4"/>

    <rect x="37" y="23" width="9" height="35" rx="1.5" fill="#e01b24"/>
    <rect x="37" y="23" width="9" height="35" rx="1.5" fill="url(#shine)"/>
    <rect x="39" y="30" width="5" height="12" rx="1" fill="#f6f5f4" fill-opacity="0.85"/>

    <rect x="47" y="30" width="13" height="28" rx="1.5" fill="#f6d32d"/>
    <rect x="47" y="30" width="13" height="28" rx="1.5" fill="url(#shine)"/>
    <rect x="47" y="35" width="13" height="2" fill="#e5a50a"/>
    <rect x="47" y="51" width="13" height="2" fill="#e5a50a"/>

    <rect x="61" y="25" width="10" height="33" rx="1.5" fill="#2ec27e"/>
    <rect x="61" y="25" width="10" height="33" rx="1.5" fill="url(#shine)"/>
    <rect x="63" y="31" width="6" height="2" rx="1" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="63" y="35" width="6" height="2" rx="1" fill="#ffffff" fill-opacity="0.7"/>

    <rect x="72" y="28" width="8" height="30" rx="1.5" fill="#9141ac"/>
    <rect x="72" y="28" width="8" height="30" rx="1.5" fill="url(#shine)"/>
    <rect x="72" y="49" width="8" height="3" fill="#613583"/>

    <g transform="rotate(-18 90 58)">
      <rect x="90" y="26" width="10" height="32" rx="1.5" fill="#ff7800"/>
      <rect x="90" y="26" width="10" height="32" rx="1.5" fill="url(#shine)"/>
      <rect x="92" y="32" width="6" height="10" rx="1" fill="#f6f5f4" fill-opacity="0.85"/>
    </g>
  </g>

  <!-- The bottom shelf: a pair lying flat, then four standing. -->
  <g>
    <rect x="24" y="99" width="30" height="7" rx="1.5" fill="#26a269"/>
    <rect x="24" y="99" width="30" height="7" rx="1.5" fill="url(#shine)"/>
    <rect x="47" y="99" width="3" height="7" fill="#1e7a4f"/>
    <rect x="26" y="92" width="26" height="7" rx="1.5" fill="#c061cb"/>
    <rect x="26" y="92" width="26" height="7" rx="1.5" fill="url(#shine)"/>
    <rect x="29" y="92" width="3" height="7" fill="#9141ac"/>

    <rect x="58" y="72" width="12" height="34" rx="1.5" fill="#1c71d8"/>
    <rect x="58" y="72" width="12" height="34" rx="1.5" fill="url(#shine)"/>
    <rect x="60" y="79" width="8" height="12" rx="1" fill="#f6f5f4" fill-opacity="0.85"/>

    <rect x="71" y="76" width="9" height="30" rx="1.5" fill="#f6f5f4"/>
    <rect x="71" y="76" width="9" height="30" rx="1.5" fill="url(#shine)"/>
    <rect x="71" y="81" width="9" height="2" fill="#c01c28"/>
    <rect x="71" y="99" width="9" height="2" fill="#c01c28"/>

    <rect x="81" y="74" width="11" height="32" rx="1.5" fill="#c01c28"/>
    <rect x="81" y="74" width="11" height="32" rx="1.5" fill="url(#shine)"/>
    <rect x="81" y="80" width="11" height="2" fill="#f5c211"/>
    <rect x="81" y="98" width="11" height="2" fill="#f5c211"/>

    <rect x="93" y="79" width="10" height="27" rx="1.5" fill="#62a0ea"/>
    <rect x="93" y="79" width="10" height="27" rx="1.5" fill="url(#shine)"/>
    <rect x="95" y="85" width="6" height="2" rx="1" fill="#ffffff" fill-opacity="0.75"/>
  </g>

  <!-- The shelves' front edges catch the light. -->
  <rect x="20" y="58" width="88" height="1" fill="#000000" fill-opacity="0.18"/>
  <rect x="20" y="106" width="88" height="1" fill="#000000" fill-opacity="0.18"/>
</svg>
